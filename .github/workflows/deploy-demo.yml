# Publishes the develop branch to https://demo.openstreetmap.sy
# via the osm-syria/website-demo repository's GitHub Pages.
name: Deploy demo

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare demo site
        run: |
          mkdir -p /tmp/demo
          rsync -a --exclude .git --exclude .github --exclude .kilo ./ /tmp/demo/
          # Keep the demo out of search engines
          printf 'User-agent: *\nDisallow: /\n' > /tmp/demo/robots.txt
          rm -f /tmp/demo/sitemap.xml

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEMO_DEPLOY_KEY }}
          external_repository: osm-syria/website-demo
          publish_branch: gh-pages
          publish_dir: /tmp/demo
          cname: demo.openstreetmap.sy
